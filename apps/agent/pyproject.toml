[project]
name = "agente-cumplimiento"
version = "0.1.0"
description = "Agente de cumplimiento de Compliance Ops (Google ADK)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
