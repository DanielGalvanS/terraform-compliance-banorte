# Sirve el build estático del frontend. La navegación usa el hash (#/hallazgos):
# solo existe la ruta /, y cualquier otra que no sea un archivo responde 404.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx en errores ni cabeceras.
    server_tokens off;

    # Cloud Run no comprime las respuestas por su cuenta.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Un add_header dentro de un location reemplaza todos los del server, así
    # que cada location vuelve a incluir las cabeceras de seguridad.
    include /etc/nginx/conf.d/cabeceras.inc;

    # index.html sin caché: es el que apunta a los archivos con hash de la
    # versión nueva. Los de /assets llevan el hash en el nombre y se pueden
    # guardar un año.
    location = /index.html {
        include /etc/nginx/conf.d/cabeceras.inc;
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        include /etc/nginx/conf.d/cabeceras.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
