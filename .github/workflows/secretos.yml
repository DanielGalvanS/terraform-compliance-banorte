name: Secretos

# Escaneo de secretos en el repositorio.
#
# Cubre el caso de prueba CP-09: un secreto en el código falla el pull request.
# Es complementario a CO-SEC-01, que mira el plan de Terraform: un valor que
# llega por variable no aparece en el código pero sí en el plan y en el estado.
on:
  # Sin filtro de rutas en los PR: este workflow es un check obligatorio de
  # main, y uno que no corre deja el PR esperando para siempre.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  escanear:
    name: Escaneo del repositorio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo permite detectar un secreto que se subió y
          # luego se borró: sigue estando en los commits anteriores.
          fetch-depth: 0

      - uses: ./.github/actions/instalar-gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}

      - name: Buscar secretos en el código
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --verbose

      - name: Buscar secretos en el historial
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact

  # CP-09: se comprueba que el escáner realmente rechaza. Sin esto, un escáner
  # mal configurado se vería igual de verde que uno que funciona.
  #
  # Este trabajo pasa cuando el escáner SÍ detecta la llave plantada.
  demostrar-rechazo:
    name: CP-09 · el escáner detecta una llave plantada
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/instalar-gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}

      - name: Una llave incrustada debe ser detectada
        run: |
          set -euo pipefail
          # El caso se construye fuera del repositorio y la llave se genera al
          # vuelo. Si la cadena estuviera escrita en este archivo, el escaneo
          # real la encontraría y fallaría para siempre.
          caso="$(mktemp -d)"
          # La regla exige exactamente 35 caracteres tras el prefijo.
          #
          # El recorte se hace con expansión de bash y no con `| head -c 35`:
          # head cierra la tubería al llegar a su cuenta, tr muere con SIGPIPE
          # y `set -o pipefail` tumba el paso antes de generar nada.
          prefijo='AIza'
          bytes="$(LC_ALL=C tr -dc 'A-Za-z0-9_-' < <(head -c 1024 /dev/urandom))"
          aleatorio="${bytes:0:35}"
          printf 'variable "clave" {\n  default = "%s%s"\n}\n' \
            "${prefijo}" "${aleatorio}" > "${caso}/main.tf"

          if gitleaks dir "${caso}" --no-banner --redact; then
            echo "::error title=Escáner inoperante::No detectó una llave evidente"
            exit 1
          fi
          echo "El escáner rechazó la llave incrustada, como se espera."
