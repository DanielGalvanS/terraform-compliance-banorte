name: Plan y veredicto

# Genera el terraform plan real contra GCP, lo exporta a JSON y lo somete a la
# compuerta de políticas. El veredicto se publica como comentario del pull
# request y se conserva como artefacto de evidencia.
#
# Corre en los PR que tocan infra/ o este archivo. Si faltan las variables de
# GCP (por ejemplo en un fork), el job se salta; la compuerta se sigue
# demostrando con los planes de ejemplo en policies.yml.
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/plan.yml'

permissions:
  contents: read
  # Necesario para Workload Identity Federation: el runner intercambia su token
  # OIDC por credenciales temporales de GCP. Así no hay ninguna llave de cuenta
  # de servicio guardada en el repositorio.
  id-token: write
  pull-requests: write

env:
  TERRAFORM_VERSION: '1.16.4'
  CONFTEST_VERSION: '0.71.1'
  AMBIENTE: dev

concurrency:
  # Un plan por pull request: los planes viejos no aportan y gastan cuota.
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan y veredicto del ambiente dev
    runs-on: ubuntu-24.04
    # Sin proveedor de identidad configurado no hay nada que planear.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    # Variables de Terraform. Vienen de las variables de GitHub (no secrets:
    # son identificadores, no credenciales). Las opcionales NO van aquí: ver el
    # paso "Variables opcionales de Terraform".
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_bucket_evidencia: ${{ vars.BUCKET_EVIDENCIA }}
      TF_VAR_centro_costos: ${{ vars.CENTRO_COSTOS }}
    steps:
      # Con el proveedor de identidad configurado pero sin el resto, el job
      # fallaría más adelante con un error de Terraform difícil de leer. Aquí
      # falla al principio y dice qué falta.
      - name: Comprobar configuración
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          BUCKET_EVIDENCIA: ${{ vars.BUCKET_EVIDENCIA }}
          CENTRO_COSTOS: ${{ vars.CENTRO_COSTOS }}
        run: |
          faltan=0
          for nombre in GCP_PROJECT_ID TF_STATE_BUCKET BUCKET_EVIDENCIA CENTRO_COSTOS; do
            if [ -z "${!nombre}" ]; then
              echo "::error title=Falta configuración::La variable de GitHub ${nombre} no está definida (Settings → Secrets and variables → Actions → Variables). Ver docs/compuerta.md"
              faltan=1
            fi
          done
          exit "${faltan}"

      # Una variable de GitHub que no existe vale cadena vacía, no "nada". Para
      # cuenta_facturacion eso sería "" en vez de null y el presupuesto
      # (DEV-16) intentaría crearse con una cuenta vacía. Por eso se exportan
      # solo si traen valor.
      - name: Variables opcionales de Terraform
        env:
          CUENTA_FACTURACION: ${{ vars.CUENTA_FACTURACION }}
          CORREOS_ALERTAS_COSTO: ${{ vars.CORREOS_ALERTAS_COSTO }}
        run: |
          if [ -n "${CUENTA_FACTURACION}" ]; then
            echo "TF_VAR_cuenta_facturacion=${CUENTA_FACTURACION}" >> "$GITHUB_ENV"
          fi
          if [ -n "${CORREOS_ALERTAS_COSTO}" ]; then
            echo "TF_VAR_correos_alertas_costo=${CORREOS_ALERTAS_COSTO}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: ./.github/actions/instalar-conftest
        with:
          version: ${{ env.CONFTEST_VERSION }}

      # Credenciales temporales, sin llaves en el repositorio. La cuenta es
      # ci-plan, de solo lectura, que crea scripts/bootstrap/gcp_pipeline.sh.
      - name: Autenticar en GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_PLAN }}

      # El backend va vacío en versions.tf para no versionar el bucket. Se pasa
      # aquí, con el mismo prefijo que backend.tfbackend.example: así el estado
      # del pipeline y el de quien despliega en local son el mismo.
      - name: terraform init
        working-directory: infra/environments/${{ env.AMBIENTE }}
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=mdc/${AMBIENTE}"

      # El plan es de solo lectura sobre la nube: describe lo que pasaría, no
      # cambia nada. El apply vive en su propio workflow, con aprobación.
      - name: terraform plan
        working-directory: infra/environments/${{ env.AMBIENTE }}
        run: |
          set -euo pipefail
          terraform plan -out=plan.bin -input=false -no-color -lock-timeout=5m
          terraform show -json plan.bin > plan.json

      - name: Evaluar políticas
        id: compuerta
        run: |
          set -euo pipefail
          estado=0
          infra/pipelines/scripts/policy_check.sh \
            "infra/environments/${AMBIENTE}/plan.json" veredicto.json || estado=$?
          echo "estado=${estado}" >> "$GITHUB_OUTPUT"
          exit "${estado}"

      # El veredicto se publica pase lo que pase: un bloqueo también es
      # evidencia, y es justo la que el revisor necesita leer.
      - name: Comentar el veredicto en el pull request
        if: always() && steps.compuerta.conclusion != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('veredicto.json')) return

            const veredicto = JSON.parse(fs.readFileSync('veredicto.json', 'utf8'))
            const simbolo = { conforme: '✅', bloqueado: '⛔', error: '⚠️' }

            const detalle = veredicto.violaciones.length
              ? ['', '| Control | Hallazgo |', '| --- | --- |',
                 ...veredicto.violaciones.map(v => `| \`${v.control}\` | ${v.mensaje} |`)].join('\n')
              : ''

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `### ${simbolo[veredicto.resultado] ?? ''} Veredicto: ${veredicto.resultado}`,
                '',
                veredicto.motivo,
                detalle,
                '',
                `<sub>commit \`${veredicto.commit.slice(0, 8)}\` · ${veredicto.fecha}</sub>`,
              ].join('\n'),
            })

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veredicto-${{ github.event.pull_request.number }}
          path: |
            veredicto.json
            infra/environments/${{ env.AMBIENTE }}/plan.json
          retention-days: 90
